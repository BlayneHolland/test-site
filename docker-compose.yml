version: '3'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile-web
    ports:
      - 80:80
    restart: no

  db:
    build:
      context: .
      dockerfile: Dockerfile-mysql
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - 3306:3306
    restart: no

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      - db
    ports:
      - 8080:80
    environment:
      - PMA_HOST=db
      - UPLOAD_LIMIT=1024M
      - MEMORY_LIMIT=1024M
      - PHP_UPLOAD_MAX_FILESIZE=1024M
      - PHP_MAX_EXECUTION_TIME=300
      - PHP_MEMORY_LIMIT=1024M
    restart: no

volumes:
  db_data: